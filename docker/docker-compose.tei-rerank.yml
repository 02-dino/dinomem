# TEI cross-encoder reranker for dinomem (semantic_search / session_search /
# hybrid_recall memory_native leg, via dinomem-neuron tools/_rerank.py).
# Recreate: docker compose -f docker-compose.tei-rerank.yml up -d --force-recreate

services:
  tei-rerank:
    container_name: tei-rerank
    # PINNED 1.9.4, NOT 1.6 -- same upstream bug the embed service was moved off
    # on 2026-10-09, but this service was missed. cpu-1.6 panics at
    # core/src/queue.rs:87 ("Queue background task dropped the receiver")
    # under concurrent load: HF issue #811, closed 2026-02-20, fix landed
    # before v1.9.3. Measured on this box 2026-10-11 BEFORE the swap:
    # RestartCount=30, 8 panics in 24h, OOMKilled=false exit=0 -- and an
    # 8-document rerank request reproducibly killed the process outright.
    # Each death is ~30s of dead reranking for semantic_search/memory_rerank.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    ports:
      - "127.0.0.1:8081:80"   # loopback-only: see SECURITY note in README
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    environment:
      - RAYON_NUM_THREADS=1
    command:
      - --model-id
      # bge-reranker-BASE (278M), not v2-m3 (568M). MEASURED 2026-11-11 on an
      # 8-core box at 2.5 cpus, 8x400 chars, 3 ground-truth probes (EN / ID /
      # ID-query-on-EN-passage):
      #   v2-m3  median 47.1s  max 64.2s  top1 2/3  spread 0.71
      #   base   median  1.39s max  1.47s top1 3/3  spread 0.41
      #   mmarco-mMiniLMv2-L12 (118M) median 0.41s top1 3/3 spread 0.16
      # v2-m3 is the wrong size for a CPU box: every call blew the 6s client
      # TIMEOUT, so recalls fail-opened to the LLM leg on EVERY request -- the
      # opposite of a fallback. base clears the timeout 4x and still gets the
      # cross-language probe; chosen over mmarco for 2.5x the score spread
      # (a wider gap = more signal into fusion) at ~1s extra. Multilingual.
      - BAAI/bge-reranker-base
      - --port
      - "80"
      - --auto-truncate
      # CAPPED 16384 (TEI default) -> 4096. Warmup pre-allocates ONE batch of
      # max-batch-tokens at the model's 8192 max seq len; for bge-v2-m3 on candle
      # CPU that spike measured 6.23GiB anon-rss (kernel memcg OOM, exit 137,
      # every ~60s, 62 restarts) -- the model itself is ~2.3GiB. Real traffic
      # from _rerank.py is 8 x 400 chars ~ 1.2k tokens, so 4096 is 3x headroom
      # on the request path and bounds warmup instead of chasing it with RAM.
      - --max-batch-tokens
      - "4096"
      # RAISED 2 -> 32 together with the 1.9.4 bump: 1.9.4 spends a permit PER
      # INPUT, so a depth of 2 would 429 any multi-document rerank. The embed
      # service hit exactly this and was moved 8 -> 16 on the same grounds.
      # 32 specifically, because TEI's own max_client_batch_size is 32 (see
      # /info): a 32-text rerank is the largest request a client can legally
      # send, so anything below 32 means TEI 429s requests it would otherwise
      # accept. Measured at depth 16 on this box: n=16 OK, n=32 -> 429.
      # Do NOT lower this to throttle load -- cap cpus/mem instead; a 429 is
      # indistinguishable from "down" to _rerank.py and just fail-opens.
      - --max-concurrent-requests
      - "32"
    # Sized for bge-reranker-base on CPU (weights ~1.1GiB fp32; measured
    # ~1.5GiB peak incl. warmup, 2026-11-11). 512m/1cpu (the MiniLM sizing)
    # cannot load it; 3g is 2x the measured peak. If you swap in v2-m3, this
    # must go to 6g AND --max-batch-tokens must stay capped: at the 16384
    # default its warmup alone OOMed a 6g cgroup on this box.
    cpus: 2.5
    mem_limit: 3g
    memswap_limit: 3g   # == mem_limit -> no swap; see docker-compose.tei.yml
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # bge warmup on CPU is minutes, not seconds (measured: still "Warming up
      # model" >3 min after start). The MiniLM 60s start_period flagged it
      # unhealthy mid-warmup; a watchdog acting on `unhealthy` then restarts
      # it forever (RestartCount=9 seen, OOMKilled=false).
      start_period: 600s
