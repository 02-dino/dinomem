version: "3.8"

services:
  tei-embed:
    # PINNED 1.9.4, NOT 1.6: cpu-1.6 panics at core/src/queue.rs:87
    # ("Queue background task dropped the receiver ... Full(..)") under
    # concurrent load and dies -> upstream bug, HF issue #811 "internal queue
    # overflow under high concurrency", closed 2026-02-20, fix landed before
    # v1.9.3. Measured on this box 2026-10-09: 1.6 crashed 79x in 5.4 days
    # (~14.6/day, OOMKilled=false, exit 0) and each reboot = ~30s of dead
    # recall, which surfaced to users as "memory_search timed out".
    # Verified before swapping: embeddings are bit-identical to 1.6
    # (cosine 1.000000, dim 384), boot 15s vs 30s, steady-state RAM LOWER
    # (844MiB vs 1.27GiB), and a 20x-parallel batch-16 burst produced ZERO
    # panics (RestartCount=0) where 1.6 reproducibly crashed on the same load.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    ports:
      - "127.0.0.1:8080:80"   # loopback-only: see SECURITY note in README
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    environment:
      # Multilingual default (EN/ID + majors). Swap this + --model-id below to change models.
      - MODEL_ID=intfloat/multilingual-e5-small
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      # Cap the internal thread pool. Unset, TEI uses every core and pinned a
      # whole VPS at ~400% CPU (load 15-26), starving the gateway event loop.
      # THIS IS THE DRAIN RATE, and it is the usual cause of a full queue:
      # --max-concurrent-requests sets how many callers may WAIT, this sets how
      # many are actually SERVED. Measured 2026-10-11 on an 8-core box running 11
      # agent workspaces: 1303 `no permits available` in 24h while the cgroup was
      # throttled only 1.31% of periods -> CPU quota was NOT the limit, the 2-thread
      # pool was. Raise this (not cpus) when recall times out under cron fan-out.
      # Rule of thumb: <= half the host cores, and keep cpus >= this value.
      - RAYON_NUM_THREADS=${TEI_RAYON_THREADS:-2}
    command:
      - --model-id
      - intfloat/multilingual-e5-small
      - --port
      - "80"
      - --auto-truncate
      # QUEUE DEPTH, not a rate limit: past this, callers get HTTP 429 instead
      # of a queue slot. It MUST exceed the number of agents/cron lanes that can
      # embed at once, or interactive memory_search gets rejected and surfaces as
      # "memory_search timed out". Real incident 2026-10-04: 11 cron lanes
      # against a depth of 3 -> TEI logged `no permits available` and recall died.
      #
      # RAISED 8 -> 16 together with the 1.9.4 bump, because 1.9.4 spends
      # permits PER INPUT where 1.6 was laxer. Measured at depth 8 on the same
      # box: a 12-item batch returned 200 on 1.6 but 429 on 1.9.4. The gateway
      # batches by TOKENS (EMBEDDING_BATCH_MAX_TOKENS=8000), so a batch well
      # over 8 items is routine -> bumping the image without this would have
      # traded crash-restarts for silent 429 rejections. 16 also clears the 11
      # cron lanes on this box with headroom; at depth 64 RAM still only hit
      # 844MiB/2GiB, so this is cheap.
      - --max-concurrent-requests
      - "${TEI_MAX_CONCURRENT:-16}"
    # Resource ceilings are DEFAULTS ON PURPOSE: a fresh install used to ship
    # with none, so the first heavy ingest could saturate the host. Raise them
    # on a bigger box; do not delete them.
    #
    # TUNING WITHOUT FORKING THIS FILE: every value below is ${VAR:-default}.
    # The defaults are what a small box should ship with, so an unset
    # environment reproduces the old pinned numbers exactly. This replaces the
    # generated docker-compose.tei.override.yml that used to be committed by
    # mistake -- a per-box number does not belong in a repo other people install.
    #
    # install.sh AUTO-SIZES these from nproc when it copies this file to the
    # workspace, so a normal install needs no manual tuning at all. To override
    # by hand, pass the value on the command line:
    #     TEI_RAYON_THREADS=6 TEI_CPUS=7 docker compose -f <file> up -d --force-recreate
    #
    # DO NOT put these in a .env file next to the compose file. Compose reads
    # .env from the PROJECT DIRECTORY (the dir holding the -f file, not your
    # cwd), and in the installed layout that directory is the agent workspace,
    # whose .env holds live credentials (GH_PAT, bot tokens, gateway token).
    # Verified 2026-10-12: a probe compose in that dir resolved a var straight
    # out of that secrets file. Nothing leaks into the container -- only vars
    # this file names are substituted -- but tuning numbers do not belong in a
    # credential file, and agents are routinely blocked from writing one.
    cpus: ${TEI_CPUS:-2.5}
    # e5-small sits near 1GiB steady-state; 2048m is headroom for the deeper
    # queue above. Too low + deep queue = OOM-kill mid-embed. Raising
    # TEI_RAYON_THREADS raises resident memory too -- give it room in the same
    # .env (measured 1.44GiB/2GiB at 2 threads before this change).
    mem_limit: ${TEI_MEM_LIMIT:-2048m}
    pids_limit: 64
    # GPU support (uncomment if you have nvidia-docker):
    # image: ghcr.io/huggingface/text-embeddings-inference:1.6
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
